<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/social.css">
</head>
<body>
    <header class="topbar hidden" id="topbar">
        <div class="logo">Social Feed</div>
        <nav>
            <button class="nav-btn active" data-page="feed">Feed</button>
            <button class="nav-btn" data-page="external">External</button>
            <button class="nav-btn hidden" data-page="moderation" id="nav-moderation">Moderation</button>
        </nav>
        <div class="user-box">
            <div class="bell-wrap">
                <button class="bell-btn" id="bell-btn" aria-label="Notifications">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
                    <span class="bell-count hidden" id="bell-count">0</span>
                </button>
                <div class="bell-menu hidden" id="bell-menu"></div>
            </div>
            <span id="current-user"></span>
            <button class="btn-small" id="logout-btn">Log out</button>
        </div>
    </header>

    <section class="auth-screen hidden" id="auth-screen">
        <div class="card auth-card">
            <h1>Social Feed</h1>
            <div class="tabs">
                <button class="tab active" data-tab="login">Log in</button>
                <button class="tab" data-tab="register">Register</button>
            </div>

            <form id="login-form">
                <label>Email or username<input name="login" required></label>
                <label>Password<input name="password" type="password" required></label>
                <button type="submit">Log in</button>
            </form>

            <form id="register-form" class="hidden">
                <label>Email<input name="email" type="email" required></label>
                <label>Username<input name="username" minlength="3" maxlength="30" required></label>
                <label>Password<input name="password" type="password" minlength="6" required></label>
                <button type="submit">Create account</button>
            </form>

            <p class="message" id="auth-message"></p>
        </div>
    </section>

    <main class="hidden" id="app">
        <section class="page" id="page-feed">
            <h2>Feed</h2>
            <form id="post-form" class="card">
                <label>Type
                    <select name="kind" id="post-kind">
                        <option value="text">Text</option>
                        <option value="image">Image</option>
                        <option value="link">Link</option>
                    </select>
                </label>
                <label>Title<input name="title"></label>
                <label>Content<textarea name="content" rows="3" maxlength="1000"></textarea></label>
                <label class="hidden" id="post-media-label">URL<input name="media_url" type="url"></label>
                <button type="submit">Publish</button>
                <p class="message" id="post-message"></p>
            </form>
            <div id="feed-root"></div>
        </section>

        <section class="page hidden" id="page-external">
            <h2>External content</h2>
            <div class="toolbar">
                <label>Source <select id="external-source"></select></label>
                <label>Moderation <select id="external-strategy"></select></label>
                <button id="external-load">Load</button>
            </div>
            <p class="message" id="external-message"></p>
            <div id="external-list"></div>
        </section>

        <section class="page hidden" id="page-moderation">
            <h2>Moderation panel</h2>
            <div class="toolbar">
                <label>Strategy <select id="mod-strategy"></select></label>
                <label class="inline"><input type="checkbox" id="mod-only-flagged"> Only flagged</label>
                <button id="mod-load">Check posts</button>
            </div>
            <p class="message" id="mod-message"></p>
            <div id="mod-list"></div>

            <h3>Try a text</h3>
            <form id="mod-check-form" class="card">
                <label>Title<input name="title"></label>
                <label>Content<textarea name="content" rows="3"></textarea></label>
                <label>Link<input name="media_url"></label>
                <button type="submit">Check</button>
                <p class="message" id="mod-check-result"></p>
            </form>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/social.js"></script>
</body>
</html>
